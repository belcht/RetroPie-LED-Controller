# Default audio = the USB dongle, addressed by its stable name "WaveshareUSB"
# (set by /etc/udev/rules.d/90-waveshare-usb-audio.rules), never by ALSA index.
# plug+dmix so multiple apps can share the card instead of locking each other out.

pcm.!default {
    type plug
    slave.pcm "dmix_waveshare"
}

pcm.dmix_waveshare {
    type dmix
    ipc_key 2048
    ipc_key_add_uid yes
    slave {
        pcm "hw:WaveshareUSB,0"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

ctl.!default {
    type hw
    card WaveshareUSB
}
