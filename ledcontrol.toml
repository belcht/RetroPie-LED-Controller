# ledcontrol.toml — Configuration for LEDControl.py

[hardware]
num_leds = 14
spi_bus = 0
spi_device = 0

[general]
global_brightness = 0.8    # 80% max brightness (0.0–1.0)
default_animate = "kitt"
default_color = "red"

[glow]
min_brightness = 0.5
max_brightness = 1.0
duration = 1.0

[cycle]
cycle_duration = 10.0
fade_time = 1.5
fade_enabled = true
# colors = ["red", "blue", "green", "purple", "orange"]  # optional: limit which colors cycle through

[kitt]
tail_length = 6
base_speed = 0.04

[cylon]
eye_width = 5       # number of LEDs in the eye (odd number looks best)
speed = 0.04        # seconds per step
min_stare = 0.5     # minimum seconds to hold position
max_stare = 3.0     # maximum seconds to hold position

[meteor]
tail_length = 8
speed = 0.05

[twinkle]
num_sparkles = 5
fade_speed = 0.04

[rainbow]
speed = 0.02

# ──────────────────────────────────────────────────────────────────────────────
# RunCommand integration — automatic LED reactions per system and per ROM
# ──────────────────────────────────────────────────────────────────────────────
#
# When a game launches, LEDControl looks up the system name here.
# Omit 'color' to use the default_color from [general].
# Valid animate values: kitt | glow | cycle | rainbow | meteor | twinkle | ""
#
[systems]
default   = { animate = "kitt",    color = "red" }
arcade    = { animate = "kitt",    color = "red" }
mame-libretro = { animate = "kitt", color = "red" }
nes       = { animate = "glow",    color = "white" }
snes      = { animate = "glow",    color = "purple" }
megadrive = { animate = "meteor",  color = "blue" }
genesis   = { animate = "meteor",  color = "blue" }
psx       = { animate = "glow",    color = "cyan" }
n64       = { animate = "rainbow" }
gb        = { animate = "glow",    color = "green" }
gba       = { animate = "glow",    color = "cyan" }
pc        = { animate = "twinkle", color = "white" }

# Per-ROM overrides — match on ROM filename without extension (case-insensitive).
# These take priority over system settings.
# Uncomment and add your own:
#
[roms]
# "Street Fighter II - The World Warrior" = { animate = "kitt", color = "red" }
# "Sonic the Hedgehog"                    = { animate = "meteor", color = "blue" }
# "Super Mario World"                     = { animate = "twinkle", color = "white" }
